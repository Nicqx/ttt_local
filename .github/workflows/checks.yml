name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check index.js
      - run: sh -n update.sh scripts/update.sh
      - run: docker build -t ultimate-tic-tac-toe:test .
